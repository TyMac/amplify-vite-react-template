version: 1
backend:
  phases:
    build:
      commands:
        - mkdir -p bin
        - curl -L -o bin/sfw https://github.com/SocketDev/sfw-free/releases/latest/download/sfw-free-linux-x86_64
        - chmod +x bin/sfw
        - PATH="$PWD/bin:$PATH" sfw npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - mkdir -p bin
        - curl -L -o bin/sfw https://github.com/SocketDev/sfw-free/releases/latest/download/sfw-free-linux-x86_64
        - chmod +x bin/sfw
        - PATH="$PWD/bin:$PATH" sfw npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*